review_guidelines = """
Review CI against the contributor trust boundary below. Repository visibility
does not grant branch-write access or trusted-runner execution to visitors.

## CI trust boundary

Same-repository contributors with permission to push branches are trusted to
run native CI workloads on the managed runner. Repository write access is
intentionally also runner-execution authority. The runner does not claim
per-job filesystem, credential,
network, or persistent-state isolation between these trusted workloads. Do not
report same-repository pull-request code running on the managed fleet as a
vulnerability, and do not require GitHub-hosted, ephemeral, virtual-machine, or
container isolation for those jobs.

Fork and external-contributor pull requests are untrusted and MUST NOT reach
the managed fleet. The pull-request dispatcher calls the reusable workflow
from the canonical repository's `main` branch. That reusable workflow derives
runner eligibility from the GitHub event: the repository must be the canonical
Fotobank repository and both the pull-request head and base repositories must
match it. Eligible jobs use `kenn-linux-x64` while private and
`kenn-linux-x64-public` after publication. All other pull requests use
GitHub-hosted runners. Do flag any change
that lets a fork or external repository select a managed runner, supply a
trusted-runner decision as an input, replace the main-pinned workflow, or
otherwise cross this admission boundary.

The public runner group admits only the canonical CI workflow on main.
Changes to contributor trust or workflow admission require a new assessment.

Focus security findings on a concrete capability gained across an actual trust
boundary. Focus other review findings on correctness, data integrity,
portability, and maintainability.

## Local checkout inspection

`checkout list` and `checkout status` are local CLI commands. They run only in
stub identity mode as the owner configured by the trusted operator. That
operator already controls and can inspect the local catalog. Extra context in
an internal or CLI error therefore does not reveal data across a trust
boundary. Do not report checkout-ID enumeration based only on differences in
local CLI error text.

Service methods must still return `ErrNotFound` for both missing records and
records owned by another principal. Any future remote transport must map that
sentinel to a generic response and must not expose the wrapped internal error.
Do flag a remote route that returns different public responses for those cases
or allows one owner to read another owner's checkout.

## Compiler and reviewer responsibilities

The compiler and typechecker own syntax, type validity, and package availability.
Leave compilation failures to those CI checks. RoboRev should review behavior,
API contracts, and logic; do not emit compilation findings based on remembered
language rules or unfamiliar syntax. If compiler results are unavailable, leave
compilation unverified rather than guessing.

Use the toolchain declared in `go.mod` as the language baseline. Do not request
pointer helpers or addressable locals merely because code uses `new(expression)`,
or reject a standard-library `"uuid"` import based on an older Go version.
Existing third-party dependencies do not require new code to use them instead of
the standard library.

## Local filesystem namespace

The local operator controls the host mount namespace and assigns the storage
roles of the configured Docbank, NAS, flash, import, and checkout roots.
Fotobank resolves symlinks and rejects ordinary path overlap, but it does not
inventory or forbid bind mounts, volume aliases, or other administrator-created
names for the same storage. Creating or retargeting one of those aliases is a
storage-role change by the trusted operator, who can already access the target
directly. Do not report a bind-mounted or administrator-created filesystem alias
as a boundary bypass. Do flag overlap reachable through ordinary path and
symlink resolution under a stable mount topology.

Database lifetime locks are sibling files derived from the exact canonical
database path. The database and its lock therefore use the same filesystem
name-resolution rules: case-only variants name the same two files on a
case-insensitive filesystem and genuinely distinct pairs on a case-sensitive
filesystem. Do not require textual case folding or claim split locking from a
case-only spelling unless a reproduced filesystem operation shows that the two
database spellings resolve to one database while the two derived lock spellings
resolve to different files.

## Local import trust boundary

The operator who invokes an import is trusted, and the configured source tree
and its parent directories must remain under that operator's control for the
duration of the import. Fotobank rejects source roots that overlap managed
storage and rejects supported media paths that are symlinks when discovered.
Its settle checks, pre-write revalidation, and Docbank expected-content identity
protect against ordinary concurrent copies and edits; they do not claim to
isolate imports from a malicious local actor who can replace source paths or
ancestor directories between filesystem operations.

Do not require descriptor-relative traversal, no-follow opens, or defenses
against adversarial source-tree replacement. Do flag direct symlink following,
managed-storage overlap, or ordinary source changes that can bypass content
identity validation under the stated trusted-local-source model.

## Local operator trust boundary

Every checkout command uses the loopback operator listener in the
existing server. Its private runtime directory and bearer credential belong to
the server's OS account. That account and administrators are trusted host
operators, not ordinary photo API users. The listener checks the credential and
configured stub owner before invoking the owner-scoped checkout service; it
accepts checkout IDs for commits and absolute host destinations for creation.
Creation validates those destinations through the server's content adapter,
retaining the existing storage-boundary and no-overwrite rules. Do flag unauthenticated or
photo-API access to this capability. Do not treat an operator who already owns
the vault and credential as an untrusted remote user. Remote administration and
header-mode photo-management commands are not supported. Local daemon status
and shutdown are host operations and work in either identity mode.

Both listeners use the same Huma operation definitions and OpenAPI document.
Operator routes live under /api/v1/operator and declare localOperator bearer
authentication. Publishing their schemas on the photo listener does not grant
access: that listener has no OperatorDeps or DaemonDeps and rejects their execution. The
local listener checks its credential before dispatch and invokes the same
application services. The CLI shares API wire types through internal/client;
checkout inspection no longer opens or bootstraps the catalog itself.

Manual backup creation uses this same authenticated listener. The configured
stub principal authorizes whole-deployment capture, including every owner's
files and hidden media; it is not a photo-user permission. The request supplies
an absolute initialized repository path and optional tag. The service rejects
the scheduler's reserved tag. Repository paths and their parents are controlled
by the trusted host operator, just as for scheduled archives. Do flag access
without the local credential or configured principal, not the intended ability
of that operator to back up all deployment data.

The operator who invokes checkout creation is trusted. The checkout root and
the parent directories of the checkout, Docbank, NAS, and flash roots must
remain under that operator's control and keep their storage roles for the
duration of creation. The operator must not open or edit the working root until
the command returns. Fotobank retains an opened checkout-directory handle and
revalidates its catalog path before durable ledger writes and activation. A
detected move leaves an errored checkout rather than an active one.

Checkout entry state is a point-in-time ledger observation. `clean` means the
bytes matched the base version when Fotobank observed them; it is not a writer
lock or a continuous guarantee after publication. External tools are expected
to edit active checkout files. Periodic scanning settles and hashes those
edits; explicit checkout commit writes tracked edits as new Docbank versions.
Scanning alone does not commit, import new files, or apply removals. The scanner
uses a retained root-bound filesystem handle, rechecks a file before and after
hashing, and revalidates the catalog root before durable state changes. Do not require an
advisory writer lock or repeated verification to eliminate mutations after the
recorded observation. Do flag records whose stored observation did not come
from the published or scanned file handle, or activation that proceeds after
Fotobank detects a materialization failure.

The working tree and its configured storage roles remain under the trusted
operator's control during each scan. Normal external-tool writes may race a scan;
Fotobank detects changed size, modification time, or file identity and retries
after another settle window. It does not claim to isolate the scanner from a
hostile local process that can preserve metadata deliberately while changing
bytes or can rewrite ancestor directories between filesystem calls.

Server startup deliberately tolerates an absent external NAS so readiness can
report the outage. Import and checkout root validation continues to fail closed
until every configured managed boundary resolves; scanner retries are expected.
NAS artifact writes must open the externally managed root and must never
create that root when it is missing.

Scheduled complete archives are opt-in and use an explicitly initialized
repository. The server reuses its live Docbank vault for capture. Fotobank
selects retention candidates only from the reserved `fotobank:scheduled` tag
after a new archive succeeds; manual archives are retained. Repository forget,
prune, and their locking belong to Docbank through the content adapter, not
direct filesystem deletion in the worker. Cleanup failure does not invalidate
the new recovery point and is retried after the next successful archive.
Partially used archive packs can retain unused bytes; full pack compaction is
not part of the current retention contract.

The backup repository is unencrypted, and its configured path is controlled by
the trusted operator or service account, not by photo users. The operator must
keep the repository private from untrusted writers. An actor who can rewrite
repository directories or manifests already has full authority to read,
alter, or delete its recovery points; internal symlink or forged-manifest
attacks by that actor do not cross a Fotobank trust boundary. Do flag any path
where an untrusted caller can select the repository or control a repository
path component. During restore, Docbank always protects the repository that was
actually opened, including a CLI `--repo` override; do not require Fotobank to
duplicate that protection, but do flag a path that bypasses it.

Recovery assumes the operator keeps storage aliases and their roles stable
while the recovery daemon runs. Retargeting a source symlink, including a
dangling one, requires stopping recovery and checking the source configuration
before restarting. Do not require a historical inventory of alias destinations
or report administrator retargeting as a security boundary bypass. Do flag
overlaps under stable path resolution, dropped protections after configuration
edits, or restore access by unauthorized callers.

Fotobank does not claim to stop a hostile local actor who can rename an opened
checkout directory into a managed root. Such an actor already needs write
permission on that managed root's parent and can write there directly. Do not
report this adversarial rename as a filesystem-isolation vulnerability. Do
flag a path controlled through Fotobank's supported inputs that escapes the
opened checkout root, replaces an existing working file, or lets a changed root
be recorded as active.
"""
