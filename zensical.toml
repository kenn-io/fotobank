[project]
site_name = "Fotobank"
site_url = "https://fotobank.kenn.io/docs/"
site_description = "Technical documentation for Fotobank, a self-hosted photo system of record built on Docbank."
site_author = "Kenn Software LLC"
copyright = 'Copyright &copy; 2026 <a href="https://kenn.io">Kenn Software LLC</a>.'
docs_dir = "docs"
site_dir = "site/docs"
repo_url = "https://github.com/kenn-io/fotobank"
repo_name = "kenn-io/fotobank"
extra_css = ["stylesheets/extra.css"]
use_directory_urls = true
nav = [
  {"Overview" = "index.md"},
  {"Use Fotobank" = [
    {"Set up Fotobank" = "guides/setup.md"},
    {"Import and recover" = "guides/import.md"},
    {"Work with checkouts" = "guides/checkouts.md"},
    {"Back up and restore" = "guides/backup.md"},
    {"Automate Fotobank" = "guides/automation.md"},
  ]},
  {"Architecture" = [
    {"System map" = "architecture/README.md"},
    {"Runtime and boundaries" = "architecture/runtime.md"},
    {"Data model" = "architecture/data-model.md"},
    {"Content and storage" = "architecture/content-and-storage.md"},
    {"Product features" = "architecture/product-features.md"},
    {"Search and AI" = "architecture/search-and-ai.md"},
    {"Frontend" = "architecture/frontend.md"},
    {"Operations" = "architecture/operations.md"},
  ]},
]

[project.extra]
homepage = "/"

[project.theme]
variant = "modern"
font = false
features = [
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.sections",
  "navigation.path",
  "content.code.copy",
]

[project.theme.palette]
scheme = "slate"
primary = "custom"
accent = "custom"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true
