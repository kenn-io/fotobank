root = "."
tmp_dir = "tmp"

[build]
cmd = "./scripts/dev-backend-build.sh"
entrypoint = "./tmp/fotobank"
delay = 500
exclude_dir = ["frontend", "internal/web/dist", "tmp", "vendor", ".git", "docs"]
include_ext = ["go", "sql", "html"]
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[screen]
clear_on_rebuild = false
