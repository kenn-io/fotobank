name: CI

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0" # Keep in sync with mise.toml.

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/package.json

      - name: Lint, type-check, and test
        run: make frontend-check

      - name: Build production assets
        run: make frontend

  browser:
    name: Browser acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24.16.0" # Keep in sync with mise.toml.

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: frontend/package.json

      - name: Build the application and isolated test server
        working-directory: frontend
        run: bun run build:e2e-server

      - name: Install Chromium and system dependencies
        working-directory: frontend
        run: bunx playwright install --with-deps chromium

      - name: Test photo workflows
        working-directory: frontend
        run: bunx playwright test --config=playwright-e2e.config.ts --output=test-results/browser

      - name: Test the default sharing-disabled interface
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: bunx playwright test --config=playwright-e2e-sharing-disabled.config.ts --output=test-results/sharing-disabled

      - name: Retain failed-browser traces and screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failures
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.16"

      - name: Build and verify
        run: |
          node --test scripts/docs/build.test.mjs
          node scripts/docs/build.mjs

  test:
    name: Linux tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: make vet

      - name: Check Huma API contract
        run: make huma-check

      - name: Test
        run: make test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  testify:
    name: Testify helper check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check Testify helper usage
        run: make testify-helper-check

  windows:
    name: Windows amd64
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "1"
      GOARCH: amd64
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Provide SQLite headers for sqlite-vec
        shell: pwsh
        run: |
          $sqliteModule = (go mod download -json github.com/mattn/go-sqlite3 | ConvertFrom-Json).Dir
          if (-not $sqliteModule) { throw 'go-sqlite3 module directory not found' }

          $includeDir = Join-Path $env:RUNNER_TEMP 'sqlite-include'
          New-Item -ItemType Directory -Path $includeDir -Force | Out-Null
          Copy-Item (Join-Path $sqliteModule 'sqlite3-binding.h') (Join-Path $includeDir 'sqlite3.h')

          $compilerIncludeDir = $includeDir.Replace('\', '/')
          "CGO_CFLAGS=-O2 -g -I$compilerIncludeDir" >> $env:GITHUB_ENV

      - name: Build
        run: go build -tags sqlite_fts5 ./...

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Test
        run: go test -timeout 20m -tags sqlite_fts5 ./...
