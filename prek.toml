default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-merge-conflict", args = ["--assume-in-merge"] },
  { id = "detect-private-key" },
  { id = "check-added-large-files", args = ["--maxkb=1024"], exclude = "^internal/geo/data/.*\\.geojson$" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"], stages = ["pre-commit"] },
  { id = "end-of-file-fixer", stages = ["pre-commit"] },
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "api-generate",
    name = "regenerate openapi spec",
    language = "system",
    entry = "mise exec bun -- make api-generate",
    files = "^(go\\.(mod|sum)|.*\\.go|Makefile|mise\\.toml|oapi-codegen\\.yaml|scripts/codegen/.*|frontend/(package\\.json|bun\\.lock|orval\\.config\\.ts|src/lib/api/transport\\.ts))$",
    pass_filenames = false,
    priority = 0,
  },
  {
    id = "gofmt",
    name = "gofmt",
    language = "system",
    entry = "gofmt -w",
    files = "\\.go$",
    priority = 0,
  },
  {
    id = "huma-check",
    name = "huma API contract check",
    language = "system",
    entry = "make huma-check HUMA_CHECK_FLAGS=-fix=false",
    stages = ["pre-push"],
    always_run = true,
    pass_filenames = false,
    priority = 5,
  },
  {
    id = "golangci-lint",
    name = "golangci-lint",
    language = "system",
    entry = "make lint-check",
    stages = ["pre-push"],
    files = "^(go\\.mod|go\\.sum|.*\\.go)$",
    pass_filenames = false,
    priority = 10,
  },
  {
    id = "testify-helper-check",
    name = "testify helper check",
    language = "system",
    entry = "make testify-helper-check",
    stages = ["pre-push"],
    files = "^(go\\.mod|go\\.sum|.*\\.go)$",
    pass_filenames = false,
    priority = 15,
  },
  {
    id = "go-test-short",
    name = "go test (short)",
    language = "system",
    entry = "env GOFLAGS=-p=1 make test-short",
    stages = ["pre-push"],
    files = "^(go\\.mod|go\\.sum|.*\\.go)$",
    pass_filenames = false,
    priority = 20,
  },
  {
    id = "nilaway",
    name = "nilaway",
    language = "system",
    entry = "make nilaway",
    stages = ["pre-push"],
    types_or = ["go", "go-mod", "go-sum"],
    pass_filenames = false,
    priority = 25,
  },
]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-hooks-apply" },
  { id = "check-useless-excludes" },
]
